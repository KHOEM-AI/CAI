<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo Scan - Count and Location</title>
<style>
:root{--bg:#050a08;--pn:#0d1613;--pn2:#12201b;--ln:#1d3a2f;--tx:#e8f5ee;--mu:#86a395;--g:#00e676;--g2:#00a152}
body.light{--bg:#eef6f1;--pn:#fff;--pn2:#e3f0e8;--ln:#b9d6c5;--tx:#10241a;--mu:#52705f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Noto Sans Khmer",sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px 12px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--pn2);border-radius:12px;padding:10px 12px}
header{display:flex;align-items:center;gap:10px}
header .t{flex:1}header b{font-size:22px;letter-spacing:.5px}header small{display:block;color:var(--mu);font-size:12px}
header button{width:42px;height:42px;padding:0}
#st{margin:12px 0;color:var(--mu)}
.big{width:100%;padding:16px;border-radius:40px;border:2px solid var(--g);background:linear-gradient(#0f6b3c,#0a4a2a);display:flex;align-items:center;gap:14px;text-align:left;color:#fff;box-shadow:0 0 22px #00e67655}
.big .ic{width:52px;height:52px;border-radius:50%;background:#bfffd9;color:#06331c;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.big b{font-size:20px;display:block}.big small{opacity:.85}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.two button{text-align:left;padding:14px;border-radius:18px}.two small{display:block;color:var(--mu)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-top:14px}
.card h3{margin:0 0 8px;font-size:16px}.mu{color:var(--mu);font-size:13px}
.pv{width:100%;border-radius:12px;display:block}.th{display:flex;gap:6px;overflow:auto;margin-top:6px}.th img{height:54px;border-radius:8px}
.r{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.r b{display:inline-block;min-width:36px;text-align:center}.r button{padding:3px 12px}
input[type=text]{background:var(--pn2);color:inherit;border:1px solid var(--ln);border-radius:10px;padding:9px;font:inherit;flex:1;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pri{background:linear-gradient(#0f6b3c,#0a4a2a);border-color:var(--g);color:#fff;font-weight:700}
iframe{width:100%;height:260px;border:0;border-radius:12px;margin-top:8px}
a{color:#5aa9ff}.hide{display:none}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:9}#toast.on{opacity:1}
</style></head><body><div id="app">
<header><button id="back" aria-label="Back">&larr;</button>
<div class="t"><b>Photo Scan</b><small>Count objects &middot; Find location</small></div>
<button id="theme" aria-label="Theme">&#9790;</button></header>
<div id="st">Take a photo or choose one to start.</div>
<button class="big" id="cam"><span class="ic">&#128247;</span><span><b>Open Camera</b><small>Take a photo and scan it</small></span></button>
<div class="two"><button id="gal"><b>From Gallery</b><small>Choose one photo</small></button><button id="bulk"><b>Multi-Photo</b><small>Choose several photos</small></button></div>
<div id="out"></div>
<div class="card"><h3>History</h3><div id="hl"></div><div class="row"><button id="clr">Clear history</button></div></div>
<input id="fc" type="file" accept="image/*" capture="environment" hidden>
<input id="fg" type="file" accept="image/*" hidden>
<input id="fb" type="file" accept="image/*" multiple hidden>
</div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const KI='http://'+(location.hostname||'localhost')+':5001/api';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=Object.assign({th:50,light:0},ls.get('cai:cfg',{})),hist=ls.get('cai:hist',[]),ses=null,model=null;
const say=t=>{$('#st').textContent=t};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2000)};

/* scale the 520px layout to fill any screen: phone, tablet, PC, TV */
const fit=()=>{document.documentElement.style.zoom=Math.min(3,Math.max(1,innerWidth/520))};
addEventListener('resize',fit);fit();

const load=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Download failed'));document.head.appendChild(s)});
async function getModel(){if(model)return model;say('Downloading model (internet needed the first time)...');
 await load('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
 await load('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
 model=await cocoSsd.load({base:'lite_mobilenet_v2'});return model}

function exifGps(buf){try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let o=2;
 while(o<v.byteLength-4){const m=v.getUint16(o),len=v.getUint16(o+2);if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiff(v,o+10);if((m&0xFF00)!==0xFF00)break;o+=2+len}}catch(e){}return null}
function tiff(v,t){const le=v.getUint16(t)===0x4949,g16=o=>v.getUint16(o,le),g32=o=>v.getUint32(o,le);
 const ifd=(o,cb)=>{const n=g16(o);for(let i=0;i<n;i++){const e=o+2+i*12;cb(g16(e),g32(e+4),e+8)}};
 let gp=0;ifd(t+g32(t+4),(tag,n,vo)=>{if(tag===0x8825)gp=g32(vo)});if(!gp)return null;
 const r={},rat=vo=>{const p=t+g32(vo),a=[];for(let i=0;i<3;i++)a.push(v.getUint32(p+i*8,le)/v.getUint32(p+i*8+4,le));return a};
 ifd(t+gp,(tag,n,vo)=>{if(tag===1)r.la=String.fromCharCode(v.getUint8(vo));if(tag===3)r.lo=String.fromCharCode(v.getUint8(vo));if(tag===2)r.lat=rat(vo);if(tag===4)r.lon=rat(vo)});
 if(!r.lat||!r.lon)return null;const d=a=>a[0]+a[1]/60+a[2]/3600,la=d(r.lat)*(r.la==='S'?-1:1),lo=d(r.lon)*(r.lo==='W'?-1:1);
 if(!isFinite(la)||!isFinite(lo)||(!la&&!lo))return null;return{lat:+la.toFixed(6),lon:+lo.toFixed(6),src:'photo'}}
const devGps=()=>new Promise(ok=>{if(!navigator.geolocation)return ok(null);
 navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),src:'device'}),()=>ok(null),{enableHighAccuracy:true,timeout:10000})});

function thumb(im,boxes,max,q){const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
 c.width=im.naturalWidth*s;c.height=im.naturalHeight*s;const x=c.getContext('2d'),fs=Math.max(11,c.width/32);x.drawImage(im,0,0,c.width,c.height);
 if(boxes){x.lineWidth=Math.max(2,c.width/200);x.strokeStyle=x.fillStyle='#00e676';x.font=fs+'px sans-serif';
  boxes.forEach(b=>{const[a,y,w,h]=b.bbox.map(n=>n*s);x.strokeRect(a,y,w,h);x.fillText(b.class,a+2,y+fs)})}
 return c.toDataURL('image/jpeg',q)}

async function one(f,fresh){const gps0=exifGps(await f.arrayBuffer()),im=new Image();im.src=URL.createObjectURL(f);await im.decode();
 let gps=gps0;if(!gps&&fresh)gps=await devGps();
 const m=await getModel(),bx=await m.detect(im,100,cfg.th/100),counts={};bx.forEach(b=>counts[b.class]=(counts[b.class]||0)+1);
 return{name:f.name,w:im.naturalWidth,h:im.naturalHeight,size:f.size,gps,counts,prev:thumb(im,bx,900,.72),th:thumb(im,null,110,.6)}}

async function run(files,fresh){ses={id:'s'+Date.now(),time:new Date().toISOString(),shots:[],adj:{},gps:null};
 let i=0;for(const f of files){i++;say('Scanning '+i+' of '+files.length+'...');
  try{ses.shots.push(await one(f,fresh))}catch(e){say('Scan failed: '+e.message);toast('Error: '+e.message)}}
 if(ses.shots.length){say('Done. Check the numbers, fix with + and -, then Save.');renderOut();$('#out').scrollIntoView({behavior:'smooth'})}}

function totals(){const t={};if(!ses)return t;const ks=new Set(Object.keys(ses.adj));ses.shots.forEach(s=>Object.keys(s.counts).forEach(k=>ks.add(k)));
 ks.forEach(k=>{const v=ses.shots.reduce((a,s)=>a+(s.counts[k]||0),0)+(ses.adj[k]||0);if(v>0)t[k]=v});return t}
const sgps=()=>ses&&(ses.gps||(ses.shots.find(s=>s.gps)||{}).gps)||null;
const mapUrl=g=>`https://www.openstreetmap.org/?mlat=${g.lat}&mlon=${g.lon}#map=18/${g.lat}/${g.lon}`;
const embed=g=>`<iframe loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${g.lon-.004},${g.lat-.003},${g.lon+.004},${g.lat+.003}&layer=mapnik&marker=${g.lat},${g.lon}"></iframe>`;

function renderOut(){const o=$('#out');if(!ses||!ses.shots.length){o.innerHTML='';return}
 const t=totals(),ks=Object.keys(t),g=sgps(),last=ses.shots[ses.shots.length-1],sum=ks.reduce((a,k)=>a+t[k],0);
 o.innerHTML=`<div class="card"><h3>Result &middot; ${ses.shots.length} photo(s) &middot; total ${sum}</h3>
 <img class="pv" src="${last.prev}"><div class="th">${ses.shots.map(s=>`<img src="${s.th}">`).join('')}</div>
 <div id="tb" style="margin-top:8px">${ks.length?ks.map(k=>`<div class="r"><span>${esc(k)}</span><span><button data-k="${esc(k)}" data-d="-1">-</button><b>${t[k]}</b><button data-k="${esc(k)}" data-d="1">+</button></span></div>`).join(''):'<div class="mu">No objects found. Add one below.</div>'}</div>
 <div class="row"><input id="nl" type="text" placeholder="Add item manually"><button id="na">+</button></div></div>
 <div class="card"><h3>Location</h3>
 <div>${g?`${g.lat}, ${g.lon} <span class="mu">(${esc(g.src)}${g.acc?' +/-'+g.acc+'m':''})</span> <a href="${mapUrl(g)}" target="_blank" rel="noopener">Open map</a>`:'<span class="mu">No location in this photo.</span>'}</div>
 ${g?embed(g):''}
 <div class="row"><button id="gd">Use my location</button><button id="gh">Enter manually</button></div>
 <div class="mu" style="margin-top:6px">Location is where the photo was taken. Gallery photos often have it removed by the phone; use Camera or Enter manually.</div></div>
 <div class="row"><button class="pri big" id="sv" style="width:auto;padding:12px 26px;border-radius:14px"><b style="font-size:16px">Save</b></button><button id="cp">Copy CSV</button></div>`;
 $('#tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;ses.adj[b.dataset.k]=(ses.adj[b.dataset.k]||0)+Number(b.dataset.d);renderOut()};
 $('#na').onclick=()=>{const l=$('#nl').value.trim().slice(0,60);if(l){ses.adj[l]=(ses.adj[l]||0)+1;renderOut()}};
 $('#gd').onclick=async()=>{say('Getting location...');const p=await devGps();if(p){ses.gps=p;renderOut();say('Location set.')}else say('Could not get location. Allow location permission.')};
 $('#gh').onclick=()=>{const t=prompt('latitude,longitude  (example: 11.5564,104.9282)');if(!t)return;const[a,b]=t.split(',').map(Number);
  if(isFinite(a)&&isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180){ses.gps={lat:a,lon:b,src:'manual'};renderOut()}else toast('Wrong format')};
 $('#sv').onclick=save;$('#cp').onclick=csv}

async function save(){const t=totals(),g=sgps(),rec={id:ses.id,time:ses.time,n:ses.shots.length,gps:g,counts:t,th:ses.shots[0].th};
 hist=hist.filter(h=>h.id!==rec.id);hist.push(rec);hist=hist.slice(-30);ls.set('cai:hist',hist);rHist();toast('Saved on this device');
 try{const r=await fetch(KI+'/scans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:rec.id,time:rec.time,name:'photo-scan',gps:g,counts:t})});
  say(r.ok?'Saved to KI server.':'KI server error '+r.status)}catch(e){say('KI server not reachable. Saved on this device only.')}}
async function csv(){const t=totals(),g=sgps(),s='label,count\n'+Object.entries(t).map(([k,v])=>'"'+k.replace(/"/g,'""')+'",'+v).join('\n')+(g?'\ngps,"'+g.lat+','+g.lon+'"':'');
 try{await navigator.clipboard.writeText(s);toast('CSV copied')}catch(e){toast('Copy failed')}}

function rHist(){$('#hl').innerHTML=hist.length?hist.slice().reverse().map(h=>`<div class="r"><span style="display:flex;gap:8px;align-items:center"><img src="${h.th}" style="height:44px;border-radius:8px"><span>${new Date(h.time).toLocaleString()}<br><span class="mu">${h.n} photo(s) &middot; total ${Object.values(h.counts).reduce((a,b)=>a+b,0)}</span></span></span>${h.gps?`<a href="${mapUrl(h.gps)}" target="_blank" rel="noopener">Map</a>`:''}</div>`).join(''):'<div class="mu">No history yet.</div>'}

$('#cam').onclick=()=>$('#fc').click();$('#gal').onclick=()=>$('#fg').click();$('#bulk').onclick=()=>$('#fb').click();
$('#fc').onchange=e=>{if(e.target.files[0])run([e.target.files[0]],true);e.target.value=''};
$('#fg').onchange=e=>{if(e.target.files[0])run([e.target.files[0]],false);e.target.value=''};
$('#fb').onchange=e=>{if(e.target.files.length)run([...e.target.files],false);e.target.value=''};
$('#clr').onclick=()=>{if(confirm('Clear all history?')){hist=[];ls.set('cai:hist',[]);rHist()}};
$('#back').onclick=()=>{history.length>1?history.back():location.href='http://'+location.hostname+':5175/'};
$('#theme').onclick=()=>{cfg.light=cfg.light?0:1;document.body.classList.toggle('light',!!cfg.light);ls.set('cai:cfg',cfg)};
document.body.classList.toggle('light',!!cfg.light);rHist();
</script></body></html>
