<div class="chat-container">

  <div class="header">
    <h2>KHOEM_AI Chat</h2>

    <!-- ជ្រើសរើស System Prompt សាកល្បង (ថ្ងៃ 3-5) -->
    <select (change)="onPromptChange($any($event.target).value)">
      <option *ngFor="let key of promptOptions" [value]="key">
        {{ key }}
      </option>
    </select>

    <button (click)="clearChat()">សម្អាតការសន្ទនា</button>
  </div>

  <!-- តំបន់បង្ហាញសារទាំងអស់ -->
  <div class="messages">
    <div
      *ngFor="let msg of messages()"
      class="message"
      [ngClass]="msg.role === 'user' ? 'user-msg' : 'assistant-msg'"
    >
      <strong>{{ msg.role === 'user' ? 'បង' : 'Claude' }}:</strong>
      <p>{{ msg.content }}</p>
    </div>

    <div *ngIf="isLoading()" class="loading">Claude កំពុងគិត...</div>
  </div>

  <!-- តំបន់វាយអត្ថបទ -->
  <div class="input-area">
    <input
      type="text"
      [ngModel]="userInput()"
      (ngModelChange)="userInput.set($event)"
      (keyup.enter)="sendMessage()"
      placeholder="វាយសាររបស់អ្នកនៅទីនេះ..."
    />
    <button (click)="sendMessage()" [disabled]="isLoading()">ផ្ញើ</button>
  </div>

</div>
