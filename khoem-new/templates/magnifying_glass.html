<!DOCTYPE html>
<html lang="km">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KHOEM_AI Accessibility</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/magnifying_glass.css') }}">

</head>

<body>

<div class="container">

    <h1>🔍 KHOEM_AI Accessibility Center</h1>

    <p>
        ប្រព័ន្ធជំនួយសម្រាប់អ្នកប្រើ
    </p>

    <hr>

    <!-- ========================= -->
    <!-- Voice -->
    <!-- ========================= -->

    <section class="panel">

        <h2>🗣 Voice</h2>

        <button onclick="toggleVoice()">
            🎙 Voice ON / OFF
        </button>

        <button onclick="readDemo()">
            ▶️ Read Demo
        </button>

        <br><br>

        <label>Voice Profile</label>

        <select id="voice-profile">

            <option value="boy">👦 Boy</option>

            <option value="girl">👧 Girl</option>

            <option value="young_man">👨 Young Man</option>

            <option value="young_woman">👩 Young Woman</option>

            <option value="elder_man">👴 Elder Man</option>

            <option value="elder_woman">👵 Elder Woman</option>

            <option value="robot">🤖 Robot</option>

            <option value="narrator">📖 Narrator</option>

            <option value="accessibility">
                ♿ Accessibility
            </option>

        </select>

    </section>

    <hr>

    <!-- ========================= -->
    <!-- Vision -->
    <!-- ========================= -->

    <section class="panel">

        <h2>🔍 Vision</h2>

        <button onclick="zoomIn()">➕ Zoom</button>

        <button onclick="zoomOut()">➖ Zoom</button>

        <button onclick="rotate()">🔄 Rotate</button>

        <button onclick="resetView()">♻ Reset</button>

        <br><br>

        <button onclick="toggleDark()">
            🌙 Dark Mode
        </button>

        <button onclick="toggleWhite()">
            ☀ White Mode
        </button>

        <button onclick="toggleContrast()">
            🎨 High Contrast
        </button>

        <button onclick="toggleLargeText()">
            🔠 Large Text
        </button>

    </section>

    <hr>

    <!-- ========================= -->
    <!-- Status -->
    <!-- ========================= -->

    <section class="panel">

        <h2>📊 Status</h2>

        <p>
            Zoom :
            <span id="zoom-value">
                100%
            </span>
        </p>

        <p>
            Rotation :
            <span id="rotation-value">
                0°
            </span>
        </p>

    </section>

    <hr>

    <!-- ========================= -->
    <!-- Preview -->
    <!-- ========================= -->

    <div
        id="preview"
        class="preview">

        <h2>KHOEM_AI</h2>

        <p>

            នេះជាអត្ថបទសាកល្បងសម្រាប់
            Accessibility។

        </p>

        <p>

            អ្នកអាចពង្រីក
            បង្វិល
            ប្តូរពណ៌
            និងស្តាប់ជាសម្លេង។

        </p>

    </div>

</div>

<script src="{{ url_for('static',
filename='js/magnifying_glass.js') }}"></script>

<script src="{{ url_for('static',
filename='js/voice.js') }}"></script>

</body>

</html>
