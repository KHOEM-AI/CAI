<div class="virtual-keyboard">
    <div class="kb-tabs">
        <button class="kb-tab active" onclick="switchKb('kh')">🇰🇭 ខ្មែរ</button>
        <button class="kb-tab" onclick="switchKb('en')">🇬🇧 EN</button>

    <div class="kb-keys" id="keyContainer"></div>
