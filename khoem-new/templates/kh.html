<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កម្មវិធីកត់ត្រាការងារ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h2>📝 កម្មវិធីកត់ត្រាការងារ</h2>
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="បញ្ចូលការងារត្រូវធ្វើ...">
            <button id="addBtn">បន្ថែម</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">ទាំងអស់</button>
            <button class="filter-btn" data-filter="active">មិនទាន់ធ្វើ</button>
            <button class="filter-btn" data-filter="completed">រួចរាល់</button>
        </div>

        <ul id="taskList"></ul>

        <div class="footer-section">
            <button id="clearCompletedBtn" class="clear-btn">លុបការងារដែលរួចរាល់</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
