<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHOEM_AI — Verify</title>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <style>
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(145deg, #061720 0%, #081e2a 48%, #06151e 100%);
            font-family: "Noto Sans Khmer", "Inter", sans-serif;
            color: #f1fbfc;
        }
        .gate-card {
            width: min(420px, 90vw);
            padding: 32px 26px;
            border: 1px solid rgba(151, 221, 231, .16);
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(13, 40, 52, .94), rgba(7, 26, 36, .92));
            text-align: center;
        }
        h1 { font-size: 18px; margin: 0 0 8px; }
        p { color: #8ca8b0; font-size: 13px; margin: 0 0 22px; }
        .h-captcha { display: flex; justify-content: center; margin-bottom: 18px; }
        button {
            width: 100%; height: 44px;
            border: none; border-radius: 13px;
            background: #61e4ef; color: #04131b;
            font-weight: 700; font-size: 14px;
            cursor: pointer;
        }
        .error { color: #ff7a83; font-size: 12px; margin-top: 14px; }
    </style>
</head>
<body>
    <div class="gate-card">
        <h1>🔒 សូមផ្ទៀងផ្ទាត់ថាបងជាមនុស្សពិត</h1>
        <p>ដើម្បីចូលទៅកាន់ KHOEM_AI Dashboard</p>
        <form method="POST" action="/api/captcha/verify">
            <div class="h-captcha" data-sitekey="{{ sitekey }}"></div>
            <button type="submit">បន្ត</button>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </div>
</body>
</html>
